<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     fill="none" stroke="#e6edf3" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- What a Fusion user actually makes: a sketch profile extruded into a parametric
       solid. Three strokes - top profile, silhouette, center edge. Never Autodesk's mark.
       STROKE IS HARDCODED #e6edf3 ON PURPOSE (adom-ui-design 1.10.1): this file is loaded
       as a TAB FAVICON, an isolated document with nothing to inherit from, so
       currentColor would resolve to BLACK and the mark would be invisible on the dark
       tab strip. currentColor belongs only in SVG inlined into page markup - the header
       mark in ui/index.html is inline and keeps it. -->
  <path d="M12 3 L20 7.5 L12 12 L4 7.5 Z"/>
  <path d="M4 7.5 V16.5 L12 21 L20 16.5 V7.5"/>
  <path d="M12 12 V21"/>
</svg>
