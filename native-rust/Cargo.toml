[workspace]
resolver = "2"
members = ["mechanical", "journal", "dispatch", "native-addin", "bom-core", "artifact-publication", "sketch-plan-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "1"
