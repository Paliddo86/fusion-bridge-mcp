[package]
name = "fusion-bom-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure Rust BOM calculation over an explicitly witnessed assembly snapshot"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "1"
