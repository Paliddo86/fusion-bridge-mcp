[package]
name = "fusion-mechanical-journal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Durable Rust-only Fusion mechanical operation admission and history"

[dependencies]
fusion-mechanical-core = { path = "../mechanical" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }
