[package]
name = "fusion-placement-observer"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]
members = []

[lib]
name = "AdomFusionRustPlacementObserver"
crate-type = ["cdylib", "rlib"]

[features]
native-sdk = []
native-bindings-check = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"] }

[build-dependencies]
cc = "1"
