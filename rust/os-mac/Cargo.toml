[package]
name = "fusion-os-mac"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "macOS implementation of fusion-core's HostProcess and HostPaths. A translation of os-win; every path in it was measured on a real Mac, see src/lib.rs."

[dependencies]
fusion-core = { path = "../core" }

# `libc` is macOS-only and confined to THIS crate, mirroring how `os-win` confines
# `windows-sys` to itself. Nothing else in the workspace may take it: keeping the two host
# crates the only OS-facing ones is what lets `core` and `lbr` build unmodified everywhere.
# Needed for exactly one call: `geteuid()` in `is_elevated` — see the comment there for why
# the dependency-free stat(`/`) alternative was wrong.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
