[package]
name = "fusion-os-win"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows implementation of fusion-core's HostProcess and HostPaths. The ONLY crate allowed to depend on windows-sys."

[dependencies]
fusion-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }
