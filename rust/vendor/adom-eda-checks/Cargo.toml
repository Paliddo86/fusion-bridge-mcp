[package]
name = "adom-eda-checks"
version = "0.24.0"
edition = "2021"
description = "The EDA Bridge Standard's checks and board-file writers, computed from the board model JSON: no bridge calls, no tool."
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "adom-eda-checks"
path = "src/main.rs"

[dependencies]
serde_json = "1"
# the SVG parser behind writers::svgart (pure Rust)
roxmltree = "0.20"
svgtypes = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
